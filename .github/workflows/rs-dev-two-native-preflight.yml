name: RS-Dev two remaining native runtime preflight
on:
  workflow_dispatch:
    inputs:
      approved:
        type: boolean
        required: true
        default: false
      packet_sha256:
        type: string
        required: true
      approval_id:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: rs-dev-ai-coding
  cancel-in-progress: false
jobs:
  native-preflight:
    if: inputs.approved && vars.RS_NATIVE_PREFLIGHT_ENABLED == 'yes' && vars.RS_ZERO_SPEND_VERIFIED == 'yes' && inputs.approval_id == vars.RS_NATIVE_PREFLIGHT_APPROVAL_ID
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RS_NATIVE_PREFLIGHT_AUTHORIZED: 'yes'
      RS_EXPECTED_PREFLIGHT_PACKET_SHA256: ${{ inputs.packet_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Verify atomic tools and immutable test gates on actual Linux
        run: node --test --test-isolation=none --test-concurrency=1 --test-reporter=tap scripts/cloud-ai/atomic-tools.test.mjs scripts/cloud-ai/native-edit-schema.test.mjs scripts/cloud-ai/phase-progress.test.mjs > LINUX-ATOMIC-CONTRACTS.tap
      - name: Fetch only pinned official native runtimes and wheels
        run: python3 scripts/remaining-preflight-download.py
      - name: Run both real native runtimes with explicit neutral mock model in isolated containers
        run: node scripts/remaining-preflight-run.mjs
      - name: Preserve explicit mock/native evidence and stop records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rs-two-native-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            LINUX-ATOMIC-CONTRACTS.tap
            DOWNLOAD-PROOF.json
            NATIVE-PREFLIGHT-RESULT.json
            results/**
          retention-days: 1
